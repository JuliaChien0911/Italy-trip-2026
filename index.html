<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026年北義自駕之旅 · 09/11–09/27</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --paper:#ffffff;
  --paper-2:#eef1ea;
  --card:#ffffff;
  --ink:#000000;
  --ink-soft:#2b2b2b;
  --pine:#1f8a5f;
  --pine-2:#146b48;
  --gold:#a85c00;
  --red:#c23a2b;
  --line:#4d4d4d;
  --green-ok:#146b48;
  --amber:#5a3c00;
  --radius:18px;
  --shadow:0 0 0 1.5px #000;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  font-weight:500;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.display{
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  font-weight:800;
  letter-spacing:-.01em;
}

.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.96);
  color:var(--ink);
  padding:14px 18px 12px;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.top-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.brand{
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-weight:800;
  font-size:19px;
  letter-spacing:-.01em;
  color:var(--ink);
}

.brand small{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-weight:500;
  font-size:10px;
  color:var(--ink-soft);
  letter-spacing:.06em;
  margin-top:2px;
}

.top-actions{display:flex; gap:8px;}

.pill-btn{
  background:var(--paper-2);
  border:1px solid var(--line);
  color:var(--ink-soft);
  padding:8px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.pill-btn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff;
  font-weight:700;
}

.maintabs{
  display:flex;
  gap:8px;
  margin-top:13px;
  overflow-x:auto;
  scrollbar-width:none;
}

.maintabs::-webkit-scrollbar{display:none;}

.mtab{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 16px;
  border-radius:999px;
  background:var(--paper-2);
  border:1px solid transparent;
  color:var(--ink-soft);
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:transform .12s ease;
}
.mtab:active{ transform:scale(.96); }

.mtab.active{
  background:var(--pine);
  color:#fff;
}

/* day rail */
.rail-wrap{margin-top:12px; position:relative;}

.rail{
  display:flex;
  gap:3px;
  overflow-x:auto;
  padding:6px 2px 10px;
  scrollbar-width:thin;
  position:relative;
}

.rail::-webkit-scrollbar{height:4px;}
.rail::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

.rail-seg{
  display:flex;
  flex-direction:column;
  align-items:center;
  flex:0 0 auto;
  width:50px;
  cursor:pointer;
  position:relative;
}

.rail-seg .line{
  position:absolute;
  top:14px;
  left:-25px;
  width:50px;
  height:2px;
  background:var(--line);
  z-index:0;
}

.rail-seg:first-child .line{display:none;}

.pin{
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--card);
  border:1.5px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  z-index:1;
  position:relative;
  color:var(--ink-soft);
}

.rail-seg.active .pin{
  background:var(--pine);
  border-color:var(--pine);
  color:#fff;
  font-weight:700;
}

.rail-seg .lbl{
  font-size:9.5px;
  margin-top:4px;
  color:var(--ink-soft);
  white-space:nowrap;
}

.rail-seg .dot{
  width:5px;
  height:5px;
  border-radius:50%;
  margin-top:3px;
}

.dot.status-plan{background:var(--gold);}
.dot.status-todo{background:var(--gold); opacity:.35;}
.dot.status-transit{background:var(--line);}

[id^="sec-"]{scroll-margin-top:128px;}

/* segmented tab switcher */
.xtabs{
  display:flex;
  gap:4px;
  background:var(--paper-2);
  padding:4px;
  border-radius:13px;
  margin-bottom:16px;
  overflow-x:auto;
  scrollbar-width:none;
}

.xtabs::-webkit-scrollbar{display:none;}

.xtabs-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  background:var(--paper-2);
  padding:6px;
  border-radius:13px;
  margin-bottom:16px;
}

.xtabs-grid .xtab{ flex:none; }

.xtab{
  flex:1 0 auto;
  text-align:center;
  padding:12px 10px;
  border-radius:10px;
  border:none;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  background:transparent;
  white-space:nowrap;
  min-height:44px;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .12s ease;
}
.xtab:active{ transform:scale(.96); }

.xtab.active{
  background:var(--card);
  color:var(--pine-2);
  font-weight:700;
  box-shadow:0 1px 4px rgba(31,36,48,.10);
}

main{
  max-width:760px;
  margin:0 auto;
  padding:18px 14px 64px;
}

/* ---------- overview / hero (route map image lives here) ---------- */
.hero{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px 18px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  margin-bottom:16px;
}

.hero h1{
  margin:0 0 6px;
  font-size:24px;
  font-weight:800;
  color:var(--ink);
}

.hero .sub{
  color:var(--ink-soft);
  font-size:13px;
  margin-bottom:14px;
}

/* postcard: currently unused in rendered output, kept minimal for safety */
.postcard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px 20px;
  margin-bottom:18px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.postcard .kicker{
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-size:14px;
  font-weight:700;
  color:var(--pine);
  margin-bottom:0;
}

.postcard h1{
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-size:26px;
  font-weight:800;
  color:var(--ink);
  margin:4px 0 8px;
  line-height:1.3;
}

.postcard .sub-en{
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.08em;
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
  margin-bottom:14px;
}

.postcard .dates{
  display:inline-block;
  background:var(--paper-2);
  padding:7px 18px;
  border-radius:999px;
  font-size:12px;
  color:var(--pine-2);
  font-weight:700;
}

.stamp{
  position:absolute;
  top:16px;
  right:18px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-family:'IBM Plex Mono',monospace;
  color:#fff;
  font-weight:700;
  line-height:1.1;
}

.stamp .s1{font-size:8px; letter-spacing:.04em;}
.stamp .s2{font-size:7px; letter-spacing:.02em; opacity:.9;}

.route-legend{list-style:none; margin:0; padding:0;}

.route-legend li{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 2px;
  border-bottom:1px solid var(--line);
}

.route-legend li:last-child{border-bottom:none;}

.route-legend .rdot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:0 0 auto;
}

.route-legend .rl-name{
  font-weight:700;
  font-size:13.5px;
  flex:1;
  color:var(--ink);
}

.route-legend .rl-date{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
}

.route-line{
  display:flex;
  align-items:center;
  margin:18px 0 7px;
  overflow-x:auto;
  padding-bottom:5px;
}

.stop{
  flex:0 0 auto;
  text-align:center;
  width:100px;
  position:relative;
}

.stop .node{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--pine);
  border:3px solid var(--card);
  box-shadow:0 0 0 1.5px var(--pine);
  margin:0 auto 6px;
}

.stop .name{
  font-weight:700;
  font-size:13px;
  color:var(--ink);
}

.stop .nights{
  font-size:11px;
  color:var(--gold);
  font-family:'IBM Plex Mono',monospace;
}

.connector{
  flex:1 1 auto;
  height:2px;
  min-width:24px;
  background:var(--line);
  margin:0 -4px 20px;
  position:relative;
  top:-13px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:16px;
}

.stat{
  background:var(--paper-2);
  border-radius:12px;
  padding:11px 8px;
  text-align:center;
}

.stat .num{
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-size:19px;
  font-weight:800;
  color:var(--pine-2);
}

.stat .lbl{
  font-size:10px;
  color:var(--ink-soft);
  margin-top:2px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:24px 0 10px;
}

.section-title h2{
  font-size:17px;
  margin:0;
  font-weight:700;
  color:var(--ink);
}

.section-title .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:.06em;
  color:var(--gold);
  text-transform:uppercase;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:12px;
}

.flight-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.flight-card + .flight-card{margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}

.flight-route{font-weight:700; font-size:14px;}

.flight-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
}

.flight-no{
  font-size:11px;
  color:var(--gold);
  font-weight:700;
  font-family:'IBM Plex Mono',monospace;
}

.accom-card h3{margin:0 0 4px; font-size:15px; font-weight:700;}

.accom-meta{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:2px 0;
}

.accom-meta .mono{color:var(--ink);}

.btn-row{
  display:flex;
  gap:8px;
  margin-top:11px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:11px 16px;
  border-radius:12px;
  font-size:13.5px;
  font-weight:700;
  text-decoration:none;
  border:1px solid transparent;
  cursor:pointer;
  min-height:44px;
  box-sizing:border-box;
  transition:transform .12s ease;
}
.btn:active{ transform:scale(.96); }

.btn-nav{
  background:var(--pine);
  color:#fff;
}

.btn-call{
  background:var(--card);
  color:var(--pine-2);
  border-color:var(--pine);
}

.btn-ghost{
  background:var(--paper-2);
  color:var(--ink-soft);
  border-color:var(--line);
}

.btn-del{
  background:transparent;
  color:var(--red);
  border:none;
  padding:8px 10px;
  font-size:13px;
  cursor:pointer;
  min-height:40px;
}

.locked-field{
  opacity:.5;
  cursor:not-allowed !important;
  pointer-events:none;
  filter:grayscale(40%);
}

.btn-add{
  background:var(--gold);
  color:#fff;
  font-size:15px;
  padding:12px 20px;
  min-height:46px;
}

.note-box{
  background:#fff6ea;
  border-left:3px solid var(--gold);
  border-radius:8px;
  padding:10px 13px;
  font-size:12.5px;
  color:#8a6416;
  margin-top:11px;
}

/* ---------- day page ---------- */
.day-head{margin-bottom:16px;}

.day-head .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:#fff;
  font-weight:800;
  letter-spacing:.04em;
  display:inline-block;
  background:var(--gold);
  padding:6px 16px;
  border-radius:999px;
}

.day-head h1{
  font-size:22px;
  font-weight:800;
  margin:8px 0 4px;
  color:var(--ink);
}

.day-head .meta{
  font-size:13px;
  color:var(--ink-soft);
}

.badge{
  display:inline-block;
  font-size:10.5px;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  margin-left:8px;
  vertical-align:middle;
}

.badge.ok{
  background:#e3f8ee;
  color:var(--pine-2);
}

.badge.todo{
  background:#fff6cc;
  color:#8a6d00;
}

.badge.transit{
  background:var(--paper-2);
  color:var(--ink-soft);
}

.block{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  margin-bottom:14px;
  overflow:hidden;
}

.block-head{
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:15px;
  background:var(--pine);
  color:#fff;
}

.block-body{padding:15px 16px;}

/* stops timeline */
.timeline{position:relative; padding-left:2px;}

.tl-stop{
  position:relative;
  padding:0 0 20px 26px;
  border-left:2px solid var(--line);
  margin-left:6px;
}

.tl-stop:last-child{
  border-left-color:transparent;
  padding-bottom:2px;
}

.tl-stop::before{
  content:'';
  position:absolute;
  left:-6px;
  top:2px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--pine);
  border:2px solid var(--card);
  box-shadow:0 0 0 1.5px var(--pine);
}

.tl-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--pine-2);
  font-weight:700;
}

.tl-title{
  font-weight:700;
  font-size:14px;
  margin:2px 0 6px;
  color:var(--ink);
}

.tl-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:8px;
}

.chip{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  white-space:nowrap;
}

.chip-green{
  background:var(--pine);
  color:#fff;
}

.chip-gold{
  background:var(--amber);
  color:#fff8ea;
}

.chip-sky{
  background:#8fc9e8;
  color:#fff;
}

.chip-clay{
  background:var(--red);
  color:#fff;
}

.tl-detail{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.65;
}

.tl-detail b{
  color:var(--ink);
  font-weight:700;
}

.tl-detail a{text-decoration:underline;}

.tl-nav{margin-top:9px;}

.empty-hint{
  font-size:12.5px;
  color:var(--ink-soft);
  font-style:italic;
  padding:6px 2px;
}

.list-item{
  border-bottom:1px solid var(--line);
  padding:11px 0;
}

.list-item:last-child{border-bottom:none;}

.list-item .li-name{
  font-weight:600;
  font-size:14px;
}

.list-item .li-meta{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:2px;
}

.list-item .li-note{
  font-size:12.5px;
  margin-top:4px;
}

textarea, input, select{
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-size:16px;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:12px 13px;
  background:var(--card);
  color:var(--ink);
  width:100%;
  min-height:46px;
}

textarea{
  min-height:130px;
  resize:vertical;
  font-family:'Inter','Noto Sans TC',sans-serif;
}

.form-row{
  display:flex;
  gap:8px;
  margin-bottom:11px;
  flex-wrap:wrap;
}

.form-row > *{flex:1 1 120px;}

.save-indicator{
  font-size:11px;
  color:var(--pine);
  font-family:'IBM Plex Mono',monospace;
  height:14px;
}

.exp-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.exp-item:last-child{border-bottom:none;}

.exp-amt{
  font-family:'IBM Plex Mono',monospace;
  font-weight:700;
}

.exp-cat{
  color:var(--ink-soft);
  font-size:11.5px;
}

.subtotal{
  display:flex;
  justify-content:space-between;
  padding-top:11px;
  margin-top:6px;
  border-top:1.5px solid var(--ink);
  font-weight:800;
  font-size:14px;
}

.back-link{
  display:inline-block;
  margin-bottom:15px;
  font-size:13px;
  color:var(--pine-2);
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:26px 14px 40px;
  color:var(--ink-soft);
  font-size:11px;
}

@media(max-width:420px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
.pill-info-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}
.pill-info{
  background:#fffefa;
  border:1.5px solid var(--line);
  border-radius:999px;
  padding:9px 16px;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink);
  box-shadow:0 2px 6px rgba(31,36,48,.05);
}
.status-banner{
  background:var(--pine-2);
  color:#fff;
  text-align:center;
  padding:12px 14px;
  border-radius:12px;
  font-weight:700;
  font-size:13.5px;
  margin-bottom:12px;
}
.dashed-divider{
  border-top:2px dashed #f0b7c4;
  margin:16px 0;
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">2026年北義自駕之旅<small>KHH ⇄ MXP · 09/11 – 09/27 · 2026</small></div>
    <div class="top-actions">
      <button class="pill-btn" id="exportBtn">匯出備份</button>
      <label class="pill-btn" for="importFile" style="cursor:pointer; margin:0;">匯入備份</label>
      <input type="file" id="importFile" accept="application/json,.json" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;">
    </div>
  </div>
  <div class="maintabs">
    <div class="mtab" id="mtab-accom" onclick="goAccom()">🗺️ 總覽</div>
    <div class="mtab" id="mtab-itinerary" onclick="goItineraryHome()">📅 每日行程</div>
    <div class="mtab" id="mtab-expense" onclick="goExpense()">💶 花費紀錄</div>
    <div class="mtab" id="mtab-tips" onclick="goTips()">💡 小提醒</div>
    <div class="mtab" id="mtab-food" onclick="goFood()">🍝 美食攻略</div>
  </div>
  <div class="rail-wrap" id="railWrap"><div class="rail" id="rail"></div></div>
</header>

<div id="saveToast" style="display:none; position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--pine); color:#fff9ec; padding:9px 18px; border-radius:999px; font-size:12.5px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:100; white-space:nowrap;">已自動儲存 ✓</div>

   {time:"07:40-12:00", title:"富內斯健行（面對歐德勒峰 Odle 群峰）", chips:[["gold","🥾 約4-4.5hr"],["gold","☀️ 上午順光"]], detail:"路線：Zannes → Zanser Alm（起點山屋）→ 沿Adolf Munkel步道前行 → <b>Geisler Alm/Rifugio Odle（約10:00-10:45在此吃正式午餐，視野最壯觀，建議點簡餐+咖啡+蘋果strudel，較不用排隊）</b> → 續行返回Zannes。全程幾乎都能看到鋸齒狀歐德勒峰，越早出發人越少、光線越柔和。沿路山屋廁所/補給充足，仍建議自備水。",
   time_end_note:""},
   {time:"12:00-12:30", title:"返回 Zannes 停車場，出發前往 San Giovanni 一帶", nav:"https://www.google.com/maps/dir/?api=1&destination=46.640475,11.71684&travelmode=driving", chips:[["sky","🚗 車程約20-25分"],["green","✅ 無ZTL"]], detail:"午餐已經在山屋吃過了，這段直接開車下山，不用再找地方吃飯。"},
   {time:"12:30-14:00", title:"San Giovanni 周邊自由散步／拍照／休息", chips:[["gold","📷 自由活動"],["sky","🚶 周邊步道"]], detail:"提早抵達，先在教堂周邊的草原、步道隨意走走拍照、讓腳休息一下，不用急著開始正式拍攝，14:00再進入下面的正式時段。"},
   {time:"14:00-15:00", title:"Chiesetta di San Giovanni in Ranui（經典教堂+歐德勒峰）", nav:"https://www.google.com/maps/dir/?api=1&destination=46.640475,11.71684&travelmode=driving", chips:[["clay","🌤 中午光線偏平"],["gold","🎫 拍照草地€4/人"],["green","✅ 無ZTL"]], detail:"停車場 46.640475,11.71684，步行至拍照點 46.636737,11.722133 約15-20分單程。此景點官方建議「清晨或近日落」光線最美，14:00屬中午時段光線偏硬；若時間允許，可考慮把這站挪到接近17:00再拍，會更金黃。拍照草地需購票約€4/人，現場售票機，建議準備硬幣。"},
   {time:"15:30-17:30", title:"Chiesetta di Santa Maddalena（聖馬達肋納村+歐德勒峰）", nav:"https://www.google.com/maps/dir/?api=1&destination=46.648693,11.7156285&travelmode=driving", chips:[["gold","📷 17:00後最佳光線"],["green","✅ 無ZTL"]], detail:"同一停車場步行前往，約10-15分。17:00後逐漸進入黃金時段，是這兩個教堂全天光線最美的時間，建議把最想拍的畫面留到接近17:30再拍。傍晚車位比中午搶手，建議提早找位。村內有咖啡廳可休息。"},
   {time:"17:30", title:"返回拉伊翁住宿", nav:"https://www.google.com/maps/dir/?api=1&destination=46.601917,11.611533&travelmode=driving", chips:[["sky","🚗 車程約30分"]], detail:"結束一天拍照與健行，返回Nature Residence Telfnerhof休息。"},
   {time:"19:00", title:"晚餐：住宿自煮", chips:[["green","🍳 不外出"],["gold","用9/12超市食材"]], detail:"用9/12在Despar超市買的食材簡單煮，健行拍照一整天，回住宿輕鬆煮飯休息就好，不用再外出找餐廳。如果食材不夠，St. Peter村內的Despar超市步行可達，可以再補一點菜。"}
 ]},
 {n:4, date:'2026-09-14', wd:'一', type:'base', base:'拉伊翁(多洛米蒂)', accom:'dolomites',
  stops: [
   {time:"06:15", title:"起床／簡單早餐", chips:[["gold","🥐 住宿食材"]], detail:"今天是重點健行拍照日，早點起床從容準備，簡單吃點東西、裝好水和行動糧即可出發。"},
   {time:"06:40", title:"出發 → Ortisei 市區停車場", nav:"https://www.google.com/maps/dir/?api=1&destination=46.573166,11.671557&travelmode=driving", chips:[["sky","🚗 車程約30分"],["clay","⏰ 務必提早"]], detail:"從拉伊翁到Ortisei車程約27-30分。<b>務必提早出發搶車位</b>：目的地停車場座標 46.573166,11.671557（Garage Central／市區地下停車場），步行到Seceda纜車站約6分、Alpe di Siusi的Mont Sëuc纜車站約5分，兩個景點共用同一個停車場，今天全程<b>不用移車</b>。收費約€1.90-2.20/小時，單日上限約€18-20，比直接在Seceda纜車站旁的停車場（單日上限€30）划算。"},
   {time:"07:10", title:"抵達停車場，步行至Seceda纜車谷站", nav:"https://www.google.com/maps/dir/?api=1&destination=46.573166,11.671557&travelmode=walking", chips:[["clay","🅿️ 旺季車位搶手，建議07:10前到"]], detail:"<b>🎫 纜車票務／預約攻略（2026年新制，出發前務必先辦好）：</b><br>1️⃣ <b>Seceda纜車強制預約時段</b>：2026年夏季起Ortisei-Furnes-Seceda纜車採線上分時段預約制，每30分鐘釋出一個時段的名額（約2/3名額開放線上預約，1/3保留給現場購票），旺季（7-8月／週末）現場買到的機率低。官網 www.seceda.it，建議出發前就先選定並預約<b>08:30這個時段</b>，越早訂越有位子，線上購票通常還有約5%早鳥折扣。<br>2️⃣ <b>已確定買 Gardena Card 3日券</b>（成人€124）：因為09/15、09/16在Val Gardena還會再搭其他纜車，3日券划算。3日券涵蓋17-18條Val Gardena區內纜車／吊椅（含Seceda），從今天09/14第一次使用起連續3天有效（09/14-09/16）；<b>但不含Alpe di Siusi(Mont Sëuc)纜車</b>，這條每次都要另外買票。持3日券搭Seceda<b>仍要另外上官網／現場輸入卡號預約時段</b>，不能省略這步。<br>3️⃣ <b>Alpe di Siusi車票</b>：3日券不含，現場或官網另外買即可，不需要預約時段，來回成人€41（2026價）。<br>4️⃣ <b>建議流程</b>：出發前先在Ortisei纜車站現場或官網買好3日券，並上 www.seceda.it 用卡號訂好08:30的Seceda時段；到現場後如果還要去Alpe di Siusi，直接在Mont Sëuc纜車站另外買票即可，不用預約。"},
   {time:"08:15-08:30", title:"取票／排隊搭乘首班Seceda纜車", chips:[["gold","🚡 已預約08:30時段"],["clay","⏰ 提早15分排隊"]], detail:"憑手機電子憑證或列印憑證進站，先搭小纜車到Furnes中繼站，再轉乘大纜車直達Seceda山頂站，全程約20分鐘，沿途記得看窗外歐德勒峰。08:30這班人潮最少，山頂視野也最乾淨。"},
   {time:"08:50-11:00", title:"Seceda山頂稜線健行＋拍照", chips:[["gold","🥾 約2hr"],["gold","☀️ 上午順光"]], detail:"出站後步行約10-15分到經典觀景台（正對Fermeda尖峰與歐德勒群峰），這是Instagram最常出現的畫面，建議一早人少時先拍。時間允許可沿稜線步道往Forcella Pana方向再走30-60分，沿途都是360度全景，記得注意坡邊安全、不要離開已鋪設步道。"},
   {time:"11:00-11:50", title:"山屋午餐：Baita Troier Hütte 或 Seceda Ristorante（山頂纜車站旁）", chips:[["gold","🍽 推薦"],["gold","📷 露台景觀"]], detail:"<b>Baita Troier Hütte</b>（電話 +39 339 821 2373）：步行約10-15分可達，evaluations一致稱讚份量大、看得到Langkofel/Sassolungo，推薦Knödel（南提洛餃子湯）、烤肋排、蘋果strudel，屬中高價位；若不想再多走，山頂纜車站旁的<b>Seceda Ristorante</b>也有南提洛式拼盤、披薩，適合時間比較趕的情況。兩間都建議吃簡餐配咖啡，留一點胃口給下午。"},
   {time:"11:50-12:15", title:"搭纜車下山，返回停車場周邊", nav:"https://www.google.com/maps/dir/?api=1&destination=46.573166,11.671557&travelmode=walking", chips:[["sky","🚡 約20分"]], detail:"原路搭纜車下山回Ortisei谷站，走回同一個停車場，車不用移動，直接往下一個纜車站前進即可。"},
   {time:"12:15-13:15", title:"Ortisei 小鎮午休／買Alpe di Siusi車票", chips:[["gold","☕ 自由活動"],["green","🎫 現場買票不用預約"]], detail:"這段空檔可以在Ortisei老街逛逛、喝杯咖啡休息，或直接走到Mont Sëuc（Alpe di Siusi）纜車谷站買下午的來回票（成人約€41，現場買即可，不需線上預約）。谷站離停車場約5分鐘。"},
   {time:"13:15-13:30", title:"排隊搭乘 Alpe di Siusi（Mont Sëuc）纜車", nav:"https://www.google.com/maps/dir/?api=1&destination=46.573166,11.671557&travelmode=walking", chips:[["sky","🚡 約4分鐘車程"]], detail:"這條纜車直接把你從Ortisei送到Alpe di Siusi高原上的Compatsch聚落，車程很短但視野開闊，是全歐洲最大的高山草原。"},
   {time:"13:30-16:30", title:"Alpe di Siusi 大草原健行＋拍照", chips:[["gold","🥾 全景步道約2-3hr"],["gold","📷 木屋+ Sassolungo經典構圖"]], detail:"出站即是Compatsch，沿指標走Panorama全景步道往東，沿途是這片高原最經典的畫面：起伏草原、木造Alm小屋、背景是Sassolungo與Sasso Piatto的鋸齒山峰，越往東走視野越好，也能遠眺對面的Seceda和歐德勒群峰。推薦順走到<b>Malga Sanon</b>山屋一帶最好拍，也可以看到Sciliar山（Schlern）的另一側全景。全程步道平緩好走，不需要專業裝備。"},
   {time:"16:00-16:30", title:"山屋咖啡／點心：Malga Sanon", chips:[["gold","🥟 推薦餃子(Knödel)＋蘋果strudel"],["gold","📷 露台正對Sassolungo"]], detail:"這間山屋以自製餃子和道地蘋果strudel出名，露台正對Sassolungo，很適合下午茶配拍照，時間有限的話可以外帶或簡單點杯咖啡+strudel休息一下就好。"},
   {time:"16:30-17:00", title:"走回Compatsch纜車站，搭乘末班纜車下山", nav:"https://www.google.com/maps/dir/?api=1&destination=46.573166,11.671557&travelmode=walking", chips:[["clay","⏰ 17:00左右末班，提早往回走"]], detail:"從Malga Sanon走回Compatsch纜車站約20-30分，記得抓時間回程，旺季平日通常18:00左右收班，但建議17:00前抵達站內比較保險，不要卡在最後一班人擠人。"},
   {time:"17:00-17:15", title:"下山返回停車場", nav:"https://www.google.com/maps/dir/?api=1&destination=46.573166,11.671557&travelmode=walking", chips:[["sky","🚡+🚶 約15分"]], detail:"搭纜車下山後直接走回同一個停車場取車，今天全程都停在同一格車位，不用移車也不用再找路。"},
   {time:"17:15", title:"開車返回拉伊翁住宿", nav:"https://www.google.com/maps/dir/?api=1&destination=46.601917,11.611533&travelmode=driving", chips:[["sky","🚗 車程約30分"]], detail:"結束充實的纜車健行日，返回Nature Residence Telfnerhof休息。"},
   {time:"19:00", title:"晚餐：住宿自煮或St. Peter村內覓食", chips:[["green","🍳 視體力決定"]], detail:"健行一整天，若體力允許可以在St. Peter村內找間小餐館放鬆吃頓熱食；比較累的話就直接用住宿廚房簡單煮，早點休息。"}
 ]},
 {n:5, date:'2026-09-15', wd:'二', type:'base', base:'拉伊翁(多洛米蒂)', accom:'dolomites',
  stops: [
   {time:"06:30", title:"起床／簡單早餐", chips:[["gold","🥐 住宿食材"]], detail:"今天要跑Selva／Passo Sella一帶，車程比去Ortisei多10-15分，建議比昨天再早一點出發。"},
   {time:"07:00", title:"出發 → Selva附近停車場（16號纜車 Piz Seteur站）", nav:"https://www.google.com/maps/dir/?api=1&destination=46.532881,11.77225&travelmode=driving", chips:[["sky","🚗 車程約40-45分"],["clay","⏰ 建議07:45前抵達"]], detail:"從拉伊翁到這一帶車程約40-45分。這裡是Sassolungo（Langkofel）群峰纜車系統的其中一個入口，停車場座標46.532881,11.77225，平日（週二）人潮比週末少很多，但仍建議提早到，旺季假日車位偏緊。"},
   {time:"08:30-09:00", title:"取票／等候16號纜車 Piz Seteur", chips:[["clay","ℹ️ 官方開放09:00，08:30到先排隊/喝咖啡"]], detail:"官網公告今年（2026）這條纜車開放時間為09:00-17:00（11/06-04/10）；08:30先到可以在站旁咖啡座稍候，也能避開09:00開門瞬間的排隊人潮，順便確認一下當天是否有調整。"},
   {time:"09:00-11:00", title:"連續搭乘 16→17→18號纜車，直上Forcella Sassolungo", chips:[["gold","🚡 三段纜車"],["gold","📷 全程都是Sassolungo正面景"]], detail:"路線：16號 Piz Seteur → 17號 Seggiovia Paradiso → 18號「棺材纜車」Passo Sella-Forcella del Sassolungo（正式名稱如此，是一台只能站2個人的迷你老式纜車廂，外型真的很像直立棺材，很多人專程來拍這台纜車，因為艙位小，尖峰時段容易要排隊等下一班，有耐心排隊即可）。18號纜車直接把你送到Forcella Sassolungo鞍部（2681m），旁邊就是Toni Demetz山屋。"},
   {time:"11:00-13:00", title:"Sassolungo群峰步道健行＋拍照（Toni Demetz → 石頭城 → Comici山屋）", chips:[["gold","🥾 約2hr"],["gold","📷 Città dei Sassi 石頭城最上鏡"]], detail:"從Toni Demetz山屋一帶開始沿步道向下走，會經過著名的<b>Città dei Sassi（石頭城）</b>——巨石崩落形成的天然迷宮，是這一區最好拍的地標之一；接著抵達<b>Rifugio Emilio Comici</b>山屋一帶，這段沿途都正面看著Sassolungo/Sella山群，是這條路線公認視野最好的一段，建議放慢腳步多拍照。地面多碎石，建議穿好走的健行鞋。"},
   {time:"13:00-13:45", title:"山屋午餐：Rifugio Emilio Comici 或 Rifugio Sasso Piatto", chips:[["gold","🍽 推薦"],["gold","🍩 Comici的bomboloni甜甜圈出名"]], detail:"<b>Rifugio Emilio Comici</b>：地點好找，適合簡餐、飲料、配一份義式甜甜圈bomboloni，露台正對Sassolungo。若還有體力／時間，也可以往<b>Rifugio Sasso Piatto</b>方向走，那邊份量實在、視野開闊，但距離較遠，建議依當天體力決定。"},
   {time:"13:45", title:"原路搭乘 18→17→16號纜車下山，返回停車場", chips:[["sky","🚡 約30-40分"]], detail:"依原路搭乘同一組纜車下山，回到早上的停車場，車不用移動就直接開往下一站。"},
   {time:"14:15", title:"出發 → S. Cristina（Mont de Seura纜車站）", nav:"https://www.google.com/maps/dir/?api=1&destination=46.551542,11.7165257&travelmode=driving", chips:[["sky","🚗 車程約10分"]], detail:"往S. Cristina方向開，車程很短。停車場座標46.551542,11.7165257，離Mont de Seura纜車站很近。"},
   {time:"14:30-14:45", title:"搭乘 Mont de Seura 纜車上山", chips:[["gold","🚡 另一角度看Sella／Sassolungo"]], detail:"這條纜車從S. Cristina這一側爬升，和早上Selva這一側的視角完全不同，可以看到Val Gardena三個村莊的另一種構圖。"},
   {time:"14:45-16:30", title:"步道健行接往 Seggiovia Pranseies（原纜車系統路網的另一端）", chips:[["gold","🥾 約1.5-2hr"],["gold","📷 換個角度拍Sassolungo/Sciliar"]], detail:"從Mont de Seura山頂沿步道往Piza Pransëies方向走，這段路網和早上的Sassolungo群峰步道是相連的，但走的是完全不同的稜線視角，能同時眺望Sciliar／Alpe di Siusi那一側。走到底可以在Pransëies纜車站稍作休息，再原路走回Mont de Seura站搭纜車下山（今天車停在Mont de Seura這側，記得走回來，不要搭到Selva那一頭）。"},
   {time:"16:30-16:45", title:"搭乘 Mont de Seura 纜車下山，返回停車場", chips:[["sky","🚡 約15分"]], detail:"回到S. Cristina這側的停車場，準備開車返回拉伊翁。"},
   {time:"17:00", title:"開車返回拉伊翁住宿", nav:"https://www.google.com/maps/dir/?api=1&destination=46.601917,11.611533&travelmode=driving", chips:[["sky","🚗 車程約35-40分"]], detail:"結束今天的Sassolungo群峰纜車健行圈，返回住宿休息。"},
   {time:"19:00", title:"晚餐：住宿自煮或St. Peter村內覓食", chips:[["green","🍳 視體力決定"]], detail:"連續兩天健行拍照，體力允許就在村內找間小餐館吃頓熱食，累的話直接用住宿廚房簡單煮。"}
 ]},
 {n:6, date:'2026-09-16', wd:'三', type:'base', base:'拉伊翁(多洛米蒂)', accom:'dolomites',
  stops: [
   {time:"05:50", title:"起床／簡單早餐", chips:[["clay","⏰ 今天最早起"]], detail:"卡雷扎湖車程較遠，且熱門停車場旺季常在09:00前就滿，今天要起得比前兩天更早。"},
   {time:"06:20", title:"出發 → Lago di Carezza（卡雷扎湖）", nav:"https://www.google.com/maps/dir/?api=1&destination=46.411885,11.575537&travelmode=driving", chips:[["sky","🚗 車程約1小時10-20分"],["clay","⏰ 務必趕在08:00前抵達"]], detail:"經Klausen／Bolzano方向南下，車程較長。目的地是湖邊主停車場P1（座標46.411885,11.575537），旺季常常09:00前就額滿，08:00前抵達成功率高很多。這個景點2026年沒有像Lago di Braies那樣的分時段預約制，先到先停。收費約€3/小時，單日上限約€30，現金或信用卡都可付款。"},
   {time:"08:00-10:00", title:"卡雷扎湖環湖步道＋拍照", chips:[["gold","🥾 環湖約20-30分"],["gold","📷 清晨最平靜、倒影最美"]], detail:"環湖步道很短（約1公里，全平緩、可推嬰兒車），主要亮點是湖水的翡翠綠色配上Latemar山群倒影，清晨風平浪靜時拍倒影效果最好，越晚遊客越多水面也容易被風吹皺。湖區禁止游泳、禁止飛空拍機。逛完可以去旁邊的旅客中心咖啡廳休息一下再上路。"},
   {time:"10:00", title:"出發 → Selva（Dantercepies纜車站）", nav:"https://www.google.com/maps/dir/?api=1&destination=46.556014,11.767498&travelmode=driving", chips:[["sky","🚗 車程約35-40分"]], detail:"沿SS241/SS242北返回Val Gardena方向，前往今天下半天的重點：Dantercepies纜車站，停車場座標46.556014,11.767498，位於Selva市區。"},
   {time:"10:40-11:00", title:"抵達停車場，準備搭乘13號纜車 Dantercepies", chips:[["clay","🅿️ 停車場為付費，約€6/日"]], detail:"這是位於Selva鎮上的停車場，離Dantercepies纜車谷站很近，收費約每日€6左右。"},
   {time:"11:00-11:30", title:"搭乘 13號纜車 Dantercepies 上 Passo Gardena", chips:[["gold","🚡 約10分"],["gold","📷 露台可看Sella群峰、Cir尖峰"]], detail:"直上Passo Gardena埡口旁的山頂站，露台視野極好，正面是Sella group，另一側是Cir尖峰群，是這一區公認最美的觀景平台之一。"},
   {time:"11:30-12:30", title:"步道健行至 Rifugio Jimmy，拍照休息", chips:[["gold","🥾 約15-20分單程"],["gold","🍽 強力推薦這間"]], detail:"沿平緩步道走向<b>Rifugio Jimmy</b>，網路上公認是Passo Gardena一帶最好吃的山屋之一，招牌是南提洛餃子湯（Knödel），很多人專程為了這間繞過來。沿途也會經過Ju de Frara觀景點，適合拍Sella group全景。"},
   {time:"12:30-13:00", title:"午餐：Rifugio Jimmy（或備案 Dantercepies山頂餐廳／Panorama Hut）", chips:[["gold","🍽 招牌：Knödel餃子湯"]], detail:"如果Jimmy客滿，Dantercepies山頂站自己的餐廳、或稍遠一點的Panorama Hut也都是不錯的備案，一樣有南提洛家常菜和自製蛋糕。"},
   {time:"13:00-13:30", title:"搭乘 14號纜車 Cir，續往Passo Gardena另一側", chips:[["gold","🚡 約5分"],["gold","📷 銜接Alta Badia方向視野"]], detail:"從Dantercepies山頂站轉搭Cir吊椅，續往Passo Gardena另一端爬升，可以看到往Alta Badia那一側的山谷景色，和早上Val Gardena這一側完全不同的畫面。"},
   {time:"13:30-14:00", title:"Cir山頂步道拍照，原路返回", chips:[["gold","📷 換個方向拍Cir尖峰"]], detail:"這裡人潮通常比Dantercepies主站少一些，適合安靜拍照。拍完後原路搭Cir→Dantercepies兩段纜車下山，回到Selva的停車場。"},
   {time:"14:00-14:30", title:"下山，走到Ciampinoi纜車站（幾乎同一區）", nav:"https://www.google.com/maps/dir/?api=1&destination=46.553366,11.762031&travelmode=walking", chips:[["clay","🅿️ 車不用移動，走過去就到"]], detail:"Ciampinoi纜車谷站的停車場（46.553366,11.762031）離Dantercepies停車場只有約500公尺，用走的就能到，今天車完全不用移動，是最順的安排。"},
   {time:"15:00-16:30", title:"搭乘 11號纜車 Ciampinoi，居高欣賞三村全景", chips:[["gold","🚡 約10分"],["gold","📷 一次看到S.Cristina／Ortisei／Selva三村"]], detail:"Ciampinoi山頂站（2254m）視野極好，可以一次看到Val Gardena三個村莊、Sassolungo、Sella群和遠方的Sciliar。今天時間有限，建議就在山頂站周邊走走拍照、喝杯咖啡休息，不用再往Comici方向深入健行（那段路昨天已經從另一側走過了）。"},
   {time:"16:30-17:00", title:"搭纜車下山，走回停車場", chips:[["sky","🚡+🚶 約20分"]], detail:"結束今天最後一段纜車行程，走回停車場準備開車回住宿。"},
   {time:"17:00", title:"開車返回拉伊翁住宿", nav:"https://www.google.com/maps/dir/?api=1&destination=46.601917,11.611533&travelmode=driving", chips:[["sky","🚗 車程約35-40分"]], detail:"今天全天奔波（卡雷扎湖＋兩段Passo Gardena纜車＋Ciampinoi），返回住宿好好休息，這是Val Gardena這幾天最後一個纜車日。"},
   {time:"19:00", title:"晚餐：住宿自煮或St. Peter村內覓食", chips:[["green","🍳 視體力決定"]], detail:"三天纜車健行結束，體力允許可以去村內犒賞自己吃頓像樣的晚餐，明天行程比較輕鬆。"}
 ]},

 {n:7, date:'2026-09-17', wd:'四', type:'base', base:'佛羅倫斯', accom:'florence', checkin:true,
  drive:{from:'拉伊翁', to:'佛羅倫斯 Margherita'},
  stops: [
   {time:"07:00", title:"拉伊翁住宿退房，準備出發", chips:[["clay","⏰ 提早退房"]], detail:"提早在07:00退房出發，車程約2.5-2.75小時到Outlet Barberino，比11:00的預定時間多留了充裕緩衝，路上可以從容休息、吃早餐，不用趕。行李這天要一路帶到佛羅倫斯，上車前確認都收好放穩。"},
   {time:"07:15", title:"出發 → Outlet Barberino Designer Outlet", nav:"https://www.google.com/maps/dir/?api=1&destination=43.9855,11.216074&travelmode=driving", chips:[["sky","🚗 車程約2.5-2.75小時"],["green","✅ 無ZTL"]], detail:"走A22 Brennero接A1往佛羅倫斯方向，時間寬裕，中途可在服務區從容休息、加油、吃早餐。"},
   {time:"11:00-14:00", title:"Outlet Barberino 購物", nav:"https://www.google.com/maps/dir/?api=1&destination=43.9855,11.216074&travelmode=driving", chips:[["gold","🛍 停留約3hr"],["green","🅿️ 免費停車"]], detail:"托斯卡尼知名精品outlet，品牌選擇多。停車場座標 43.9855, 11.216074。行李箱記得收好在後車廂上鎖，退稅單這裡就可以先辦（單店滿€70.01可退稅）。"},
   {time:"14:00", title:"出發 → Esselunga 超市（佛羅倫斯）補給", nav:"https://www.google.com/maps/dir/?api=1&destination=43.791917,11.223342&travelmode=driving", chips:[["sky","🚗 車程約20-25分"]], detail:"超市離住宿很近，先採買再去check-in，行李留車上鎖。"},
   {time:"14:25-14:45", title:"超市採購（Esselunga）", chips:[["gold","🛒 約20分"]], detail:"可以買佛羅倫斯這兩晚的早餐、水果、水，離Margherita住宿只有1-2分鐘車程。"},
   {time:"14:50", title:"Check-in Margherita（佛羅倫斯）", nav:"https://www.google.com/maps/dir/?api=1&destination=43.78928,11.22517&travelmode=driving", chips:[["green","🅿️ 私人車位"],["green","✅ 無ZTL"]], detail:"San Donato/Novoli一帶不在ZTL範圍，車直接停在民宿私人車位即可，接下來兩天在佛羅倫斯市區都建議搭T2電車進出，車留在住宿不用再開。"},
   {time:"15:30", title:"步行到 San Donato-Università 電車站，搭T2電車進城", nav:"https://www.google.com/maps/dir/?api=1&destination=San+Donato+Universit%C3%A0+tram+stop,+Firenze&travelmode=walking", chips:[["sky","🚊 電車攻略"],["green","✅ 無ZTL"]], detail:"<b>🚊 搭電車完整攻略：</b><br>1️⃣ <b>上車站</b>：住宿走路約1-2分鐘到「San Donato-Università」站，方向選往市中心／San Marco（不要搭到機場方向）。<br>2️⃣ <b>買票</b>：站上有黃色售票機，或前一天先在附近菸草店(Tabaccheria)買好，單程票 <b>€1.50</b>／人，上車後記得在車廂內小機器「打票驗證」（第一次使用才生效，沒打票查票會被罰款）。<br>3️⃣ <b>下車站</b>：搭到「<b>Unità</b>」站（Piazza dell'Unità Italiana），這站離中央市場、聖羅倫佐教堂、百花大教堂都只要走路5-10分鐘，離晚上的餐廳也很近。<br>4️⃣ <b>車程</b>：約15-18分鐘，白天班距很密（尖峰約4-5分鐘一班，離峰也不會等太久）。<br>5️⃣ <b>回程</b>：晚上搭車要注意，00:30後末班改成每22分鐘一班（週五六延長到凌晨2點），我們預計21:00左右回程完全沒問題，不用擔心。"},
   {time:"15:50-16:30", title:"Mercato Centrale Firenze 中央市場逛逛", nav:"https://www.google.com/maps/dir/?api=1&destination=43.7727,11.2520&travelmode=walking", chips:[["gold","🍽 可簡單試吃"],["sky","🚶 步行區"]], detail:"下電車走路約5分鐘。可以逛逛一樓生鮮市場、二樓美食街，順便看看有沒有想試的Lampredotto牛肚三明治或松露漢堡，先墊墊胃留晚餐胃口給丁骨牛排。"},
   {time:"16:30-17:30", title:"百花大教堂（Duomo）周邊散步拍照", nav:"https://www.google.com/maps/dir/?api=1&destination=43.773449,11.256236&travelmode=walking", chips:[["gold","📷 熱門拍照點"],["sky","🚶 步行約5分"]], detail:"從中央市場走過去約5分鐘。可以繞教堂外觀、喬托鐘樓、聖若望洗禮堂拍照，這個時間點人潮已經比中午稍微少一些。"},
   {time:"17:30-18:15", title:"悠閒散步往餐廳方向", chips:[["green","🚶 慢慢走"]], detail:"從百花大教堂走到Dall'Oste所在的Borgo San Lorenzo一帶只要幾分鐘，這段時間可以隨意逛逛周邊小巷、聖羅倫佐市集攤販，不用趕。"},
   {time:"18:15", title:"抵達 Trattoria Dall'Oste（提前15分鐘，保留訂位）", nav:"https://www.google.com/maps/dir/?api=1&destination=43.7748,11.2549&travelmode=walking", chips:[["clay","🚫 全程步行/電車，車留在住宿"]], detail:"地址 Borgo S. Lorenzo, 31, 50123 Firenze，位於歷史城區ZTL範圍內。餐廳就在中央市場旁邊1分鐘、聖羅倫佐教堂2分鐘，這時候應該已經在附近逛完，直接走過去就好。"},
   {time:"18:30", title:"晚餐：Trattoria Dall'Oste（已訂位✅ 2位）", nav:"https://www.google.com/maps/dir/?api=1&destination=43.7748,11.2549&travelmode=walking", chips:[["gold","🥩 必點丁骨牛排"],["gold","訂位確認email已寄"]], detail:"透過TheFork訂位，確認信已寄到 Julia_Chien0911@hotmail.com。電話 +39 055 288 017。<br><b>必點：</b>Bistecca alla Fiorentina 佛羅倫斯丁骨牛排，兩人建議選 1.2-1.3kg（最推薦份量），熟度強烈建議 Rare（三分熟），這是正宗佛羅倫斯吃法。<br><b>推薦組合：</b>Burrata起司開胃、Pappardelle野豬肉醬寬麵或松露燉飯兩人共食一份、烤馬鈴薯、烤蔬菜，飯後可加點Affogato阿芙佳朵當甜點。<br><b>預算：</b>兩人約€120-160（約NT$4,500-6,000，依牛排重量而定）。<br><b>用餐時間：</b>抓2小時左右，熱門時段19:00-20:00最搶手，還好我們18:30就到不用等。"},
   {time:"20:30-21:00", title:"飯後散步：百花大教堂夜景", nav:"https://www.google.com/maps/dir/?api=1&destination=43.773449,11.256236&travelmode=walking", chips:[["gold","📷 夜間點燈"],["sky","🚶 步行約5分"]], detail:"吃飽走回百花大教堂，晚上打燈後氣氛跟白天完全不同，人潮也少很多，很適合拍夜景照片。走累的話這段純散步不用趕時間。"},
   {time:"21:00", title:"步行到 Unità 電車站，搭T2電車回住宿", nav:"https://www.google.com/maps/dir/?api=1&destination=43.7765,11.2480&travelmode=walking", chips:[["sky","🚊 末班還很久，不用擔心"],["green","✅ 無ZTL"]], detail:"從Duomo走回Unità站約5-8分鐘。方向選往機場/San Donato方向搭車，坐到「San Donato-Università」下車，車程約15-18分鐘。21:00這個時段班距還很密集（約5-10分鐘一班），00:30後才會降為每22分鐘一班，完全不用趕。記得上車一樣要打票（如果買的是當日還沒用過的新票）。"},
   {time:"21:20", title:"抵達住宿，結束一天", nav:"https://www.google.com/maps/dir/?api=1&destination=43.78928,11.22517&travelmode=walking", chips:[["green","🏠 步行約1-2分"]], detail:"下車走回Margherita，結束充實的一天！"}
 ]},

 {n:8, date:'2026-09-18', wd:'五', type:'base', base:'佛羅倫斯', accom:'florence',
  stops: [
   {time:"09:00", title:"悠閒起床，住宿附近簡單吃早餐", chips:[["green","🐌 今天不趕時間"]], detail:"今天整天在市區慢遊，不用早起，膝蓋不舒服更要放慢步調，走累了就找地方坐下來休息，不用勉強走完每一個點。"},
   {time:"09:45", title:"步行到San Donato-Università電車站，搭T2進城", nav:"https://www.google.com/maps/dir/?api=1&destination=San+Donato+Universit%C3%A0+tram+stop,+Firenze&travelmode=walking", chips:[["sky","🚊 約15-18分到市區"],["green","✅ 車留在住宿，今天不開車"]], detail:"跟09/17晚上一樣的路線，走到San Donato-Università站搭往市中心方向的T2電車，車程約15-18分，坐到「Unità」站（Piazza dell'Unità Italiana）下車，這站離百花大教堂、聖羅倫佐一帶都很近。記得上車後到車廂內機器打票驗證。"},
   {time:"10:05-10:30", title:"步行穿過主教座堂周邊，往Ponte Vecchio方向（不進去登頂）", nav:"https://www.google.com/maps/dir/?api=1&destination=43.76799,11.25316&travelmode=walking", chips:[["green","📷 外觀欣賞即可"],["clay","🚫 今天不登頂百花大教堂"]], detail:"從Unità站走過百花大教堂廣場，純欣賞外觀跟喬托鐘樓，不用排隊登頂，對膝蓋比較友善。接著沿路慢慢走向領主廣場、Ponte Vecchio方向，這段路巷弄很多，可以隨性繞進看到的小巷逛逛，不用照著地圖走。"},
   {time:"10:30-11:00", title:"Ponte Vecchio 老橋逛金飾店", chips:[["gold","📷 橋上金飾店櫥窗"],["sky","🚶 步行區"]], detail:"橋上兩側都是金飾銀樓，可以慢慢逛櫥窗，橋中段有個開闊平台可以拍河景，人多但值得停留拍照。"},
   {time:"11:00-13:00", title:"過橋進入Oltrarno藝術工匠區，隨性穿梭巷弄", chips:[["gold","🎨 皮件／珠寶／陶藝工坊"],["gold","📷 巷弄驚喜最多的一段"]], detail:"過橋後就是Oltrarno，這區是佛羅倫斯的工匠聚落，路上常常能看到老師傅在店裡現場製作皮件、珠寶、陶藝，很適合你喜歡的那種隨意鑽小巷的逛法。重點街區：<b>Via Maggio</b>（老字號工坊聚集）、<b>Piazza Santo Spirito</b>（在地生活感很強的廣場，教堂立面樸素但氣氛好）、<b>Sdrucciolo de' Pitti</b>與周邊小巷。不用特別按順序走，看到喜歡的小店就進去逛，這一區逛起來最有「轉角驚喜」的感覺。"},
   {time:"12:30-13:00", title:"小吃午餐：I' Trippaio di San Frediano（Piazza dei Nerli）", nav:"https://www.google.com/maps/dir/?api=1&destination=43.769530,11.241645&travelmode=walking", chips:[["gold","🥪 招牌lampredotto三明治€4"],["green","🍷 不用坐餐廳"]], detail:"當地人公認最道地的lampredotto（燉牛胃三明治）小攤之一，不是觀光客常去的那種，客人大多是附近居民。點一份三明治配一小杯紅酒（gottino），直接坐在廣場長椅上吃，很輕鬍，完全符合你想要的「不一定要坐餐廳」的小吃體驗。"},
   {time:"13:00-13:20", title:"甜點：Gelateria della Passera（小巧精緻）", chips:[["gold","🍨 推薦口味：迷迭香蜂蜜"]], detail:"就在附近，店面很小但口味做得很細緻，推薦帶點特色的迷迭香蜂蜜口味，不用特地繞路，順路就能吃到。"},
   {time:"13:20-15:00", title:"繼續在Oltrarno／San Niccolò一帶散步", chips:[["gold","📷 San Niccolò安靜巷弄"],["green","🪑 累了隨時找咖啡座休息"]], detail:"這一帶比Ponte Vecchio周邊安靜很多，適合慢慢晃、找家小咖啡館坐下來歇腳。如果膝蓋開始有點累，這個時段很適合找間咖啡廳坐久一點，反正今天沒有非去不可的景點。"},
   {time:"15:00-15:30", title:"過河回市區（Ponte alle Grazie或Ponte Vecchio皆可）", chips:[["green","🚶 依體力選擇過橋點"]], detail:"往回走的時候可以選一座沒走過的橋，換個角度看Arno河景。"},
   {time:"15:30-17:00", title:"聖十字教堂周邊＋Sant'Ambrogio市場一帶巷弄散策", nav:"https://www.google.com/maps/dir/?api=1&destination=Mercato+di+Sant%27Ambrogio,+Firenze&travelmode=walking", chips:[["gold","🛍 在地市場，觀光客較少"],["gold","🍷 尋找隱藏版wine window"]], detail:"這一帶是佛羅倫斯人自己買菜的市場，不像Mercato Centrale那麼觀光化，適合純逛（不一定要買東西）。這一區也藏了幾個還在營業的「buchette del vino」（老佛羅倫斯人牆上賣酒的小窗口，17世紀傳下來的傳統，現在全城僅剩約10個還在運作），走累了可以順路找一個買杯酒站著喝，算是這趟旅行一個很特別的巷弄小驚喜。"},
   {time:"17:00-17:30", title:"步行到Ponte Vecchio旁Lungarno搭13號公車", nav:"https://www.google.com/maps/dir/?api=1&destination=Lungarno+degli+Archibusieri,+Firenze&travelmode=walking", chips:[["clay","🚌 不走樓梯上山，膝蓋友善"]], detail:"要上米開朗基羅廣場看夜景，<b>不要走階梯路線</b>（Via di San Salvatore al Monte那段有很多台階），改在Lungarno degli Archibusieri搭<b>13號公車</b>直接上山，車程約15-20分，車票€1.70（上車前先在菸草店/Tabaccheria買好比較便宜，車上買現金約€2.5）。"},
   {time:"17:45-19:30", title:"米開朗基羅廣場（Piazzale Michelangelo）看夕陽夜景", chips:[["gold","📷 佛羅倫斯最經典的全景"],["gold","🌅 建議日落前1hr抵達佔位"]], detail:"廣場本身很平坦好走，不用爬樓梯，適合久站慢慢等天色變化。這裡是俯瞰整個佛羅倫斯舊城、百花大教堂圓頂、Arno河的經典角度，日落前後天空會變得很戲劇性，建議留至少1.5-2小時，天黑後華燈初上也很美。廣場旁有小吃攤和咖啡車，可以邊等邊墊墊肚子。（旁邊聖米尼亞托教堂San Miniato al Monte視野更高但要再爬一段坡，膝蓋不舒服的話這段可以跳過，米開朗基羅廣場本身視野已經很夠）"},
   {time:"19:30-19:45", title:"搭13號公車下山回市區", chips:[["sky","🚌 約15-20分"]], detail:"原路搭公車下山，回到Lungarno附近。"},
   {time:"19:45-20:45", title:"晚餐：市區找小吃收尾（schiacciata／熟食店／wine bar）", chips:[["gold","🥙 輕鬆解決，不用正式坐餐廳"]], detail:"回到市區後可以找家schiacciata（佛羅倫斯扁麵包三明治）小店，或找間wine bar點杯酒配幾樣小點心當晚餐收尾，延續今天「不用正式坐下吃飯」的步調，吃飽就慢慢走回Unità電車站。"},
   {time:"21:00", title:"步行到Unità電車站，搭T2電車回住宿", nav:"https://www.google.com/maps/dir/?api=1&destination=43.7765,11.2480&travelmode=walking", chips:[["sky","🚊 這時段班距還算密集"]], detail:"跟09/17晚上一樣，搭往San Donato方向的T2，坐到「San Donato-Università」下車，走回Margherita結束這充實又悠閒的一天。"}
 ]},

 {n:9, date:'2026-09-19', wd:'六', type:'base', base:'西恩納', accom:'siena', checkin:true,
  drive:{from:'佛羅倫斯', to:'西恩納 阿洛基聖費代萊酒店'},
  stops: [
   {time:"07:00", title:"起床／Margherita 退房", chips:[["clay","🧳 退房10:00前，但今天提早出發"]], detail:"今天是移動日＋西恩納一日遊，行李前一晚先收好，7點起床簡單吃點東西、把行李搬上車就可以出發，不用等到退房截止時間。"},
   {time:"07:15-08:30", title:"開車前往西恩納 San Fedele 住宿，先卸行李", nav:"https://www.google.com/maps/dir/?api=1&destination=43.3192,11.2734&travelmode=driving", chips:[["sky","🚗 車程約1小時10-15分"],["green","✅ 已與屋主確認可提早寄放"]], detail:"從佛羅倫斯走Raccordo Firenze-Siena，車程約70-75分。<b>San Fedele官方入住時間是16:00-21:00</b>，已事先跟屋主 Antonella（+39 338 30.30.095）／Giuseppe（+39 335 68.14.606）談好，今天中午可以先把行李放在農莊，下午再正式入住，不用擔心撲空。地址 SP 101 Km 4.7, Montalbuccio 132。"},
   {time:"08:30-09:00", title:"開車前往西恩納城區 Parcheggio Santa Caterina", nav:"https://www.google.com/maps/dir/?api=1&destination=43.3171988,11.3243961&travelmode=driving", chips:[["sky","🚗 車程約10-15分"],["clay","⏰ 週六旺季，越早越好"]], detail:"這座停車場地址 Via Esterna di Fontebranda，是西恩納少數<b>有電梯＋長手扶梯直通城區</b>的停車場：從B2/B1樓層搭電梯上到地面樓，再走一小段上坡到城牆邊的手扶梯入口，一路搭手扶梯（共12段，2005年啟用，地下化設計）直達城區<b>Via di Valle Piatta</b>，出站處距離主教座堂不到200公尺。費率與Il Campo等主要停車場相同，約€2/小時，一日券約€35（住宿旅客可向San Fedele索取QR code享優惠日票）。<b>今天是週六，車位競爭激烈，建議9點前抵達</b>，太晚可能一位難求，需改去更外圍的Fortezza或車站停車場再走比較遠的路。"},
   {time:"09:00-09:20", title:"停車，搭電梯＋手扶梯進城", chips:[["gold","🛗 電梯＋手扶梯"],["green","🚻 停車場內有洗手間"]], detail:"停好車後先找電梯上到地面樓（Ground樓層），出停車場後往右沿斜坡走一小段，看到城牆缺口和指標就是手扶梯入口，一路都在地下化的手扶梯隧道裡，涼爽也不用曬太陽，出站就已經在城區裡，離主教座堂只要幾分鐘。"},
   {time:"09:20-11:00", title:"主教座堂 Duomo di Siena（含地板拼貼、Piccolomini圖書館、洗禮堂、Facciatone全景台）", nav:"https://www.google.com/maps/dir/?api=1&destination=43.317185,11.328823&travelmode=walking", chips:[["gold","🎫 建議買OPA SI Pass套票"],["gold","📷 Facciatone登頂全景"]], detail:"西恩納主教座堂是義大利最華麗的哥德式教堂之一，黑白條紋外觀＋內部大理石鑲嵌地板（部分區域全年開放，部分僅特定月份掀開）非常值得細看。建議買<b>OPA SI Pass</b>套票，含主教座堂本體、Piccolomini圖書館（內有精美濕壁畫）、洗禮堂（Battistero）、地下墓室（Cripta），以及最推薦的<b>Facciatone全景台</b>——爬上去可以看到整個西恩納紅瓦屋頂與托斯卡尼丘陵全景，是這座城市最好拍的制高點之一。旺季建議先線上購票避免現場排隊。"},
   {time:"11:00-11:30", title:"步行前往主廣場，順路逛巷弄", nav:"https://www.google.com/maps/dir/?api=1&destination=43.318333,11.331389&travelmode=walking", chips:[["green","🚶 步行約8-10分"],["gold","📷 沿途中世紀窄巷"]], detail:"從主教座堂沿Via di Città或Via del Capitano慢慢走向Piazza del Campo，這段路兩側都是中世紀石造老屋和小店，不用刻意繞路，走著走著就有驚喜。"},
   {time:"11:30-12:15", title:"Piazza del Campo 貝殼廣場＋Fonte Gaia", chips:[["gold","📷 歐洲最美廣場之一"],["green","🪑 廣場邊可席地而坐"]], detail:"扇貝形的Piazza del Campo是Palio賽馬節的舉辦地，也是義大利公認最美的中世紀廣場之一。廣場一端是Fonte Gaia噴泉（複製品，原件在旁邊的Santa Maria della Scala博物館內），很多人直接坐在廣場斜坡上曬太陽、看街頭藝人表演，很適合坐下來休息、拍照。"},
   {time:"12:15-13:30", title:"午餐：西恩納平價美食（依當天候位彈性選）", nav:"https://www.google.com/maps/search/?api=1&query=Osteria+Da+Gano+Siena", chips:[["gold","🍝 首選 Osteria da Gano"],["green","💶 兩人約 €35–50"],["clay","📅 週六建議訂位"]], detail:"<b>首選｜Osteria da Gano</b>：距田野廣場步行約7–10分鐘，家庭式小酒館、價格合理。推薦Pici cacio e pepe（起司黑胡椒粗手工麵）、當日手工麵或西恩納風燉肉；兩人簡單吃約€35–50。<br><br><b>想快速吃｜La Piccola Ciaccineria</b>：托斯卡尼夾餡薄餅Ciaccino，兩人約€10–20，適合不想壓縮逛城時間。<a href='https://www.google.com/maps/search/?api=1&query=La+Piccola+Ciaccineria+Via+San+Pietro+Siena' target='_blank' style='color:var(--red);font-weight:800'>地圖</a><br><br><b>順路備選｜Osteria Permalico</b>：位於主教座堂與田野廣場一帶，推薦白肉醬千層麵、Cinta Senese黑豬肉醬麵或Ricotta gnocchi；兩人約€35–50。<a href='https://www.google.com/maps/search/?api=1&query=Osteria+Permalico+Siena' target='_blank' style='color:var(--red);font-weight:800'>地圖</a><br><br><b>想坐著慢慢吃｜Antica Trattoria Papei</b>：位於Piazza del Mercato，推薦Pici、Ribollita麵包蔬菜湯；兩人完整用餐約€50–70。<a href='https://www.google.com/maps/search/?api=1&query=Antica+Trattoria+Papei+Siena' target='_blank' style='color:var(--red);font-weight:800'>地圖</a><br><br><b>點餐提醒：</b>餐廳通常另收每人約€2–3 coperto座位費。野豬不是鹿，但若不想吃野味，選起司黑胡椒、番茄或一般肉醬Pici即可。"},
   {time:"13:30-14:30", title:"Palazzo Pubblico＋Torre del Mangia 登塔看城景", nav:"https://www.google.com/maps/dir/?api=1&destination=43.318333,11.331389&travelmode=walking", chips:[["gold","🏰 102公尺高塔"],["clay","🥾 400級台階，量力而為"]], detail:"就在Piazza del Campo旁，市政廳內的市立博物館有著名的Lorenzetti「好政府與壞政府的寓言」濕壁畫，登Torre del Mangia可以360度俯瞰整個西恩納和托斯卡尼田野，是另一個經典制高點角度（和上午的Facciatone互為對照組）。塔內樓梯窄且陡，建議衡量體力，時間不夠可以只逛市立博物館。"},
   {time:"14:30-16:00", title:"巷弄漫遊＋伴手禮：Via di Città、Via Banchi di Sopra 老街", chips:[["gold","🛍 Panforte／Ricciarelli伴手禮"],["gold","📷 隨走隨拍"]], detail:"這一段沒有硬性行程，順著Via di Città、Banchi di Sopra這幾條老城主街隨意逛，兩旁都是百年老店。想買伴手禮可以去<b>Antica Drogheria Manganelli 1879</b>（Via di Città 71/73，電話 +39 0577 280002），從1879年開到現在的老雜貨舖，Panforte（西恩納硬式水果蛋糕）、Ricciarelli杏仁餅乾、松露醬、初榨橄欖油、Chianti紅酒這裡一次買齊，店員會說英文也能幫忙打包郵寄。"},
   {time:"16:00-16:45", title:"下午茶：手工冰淇淋", chips:[["gold","🍨 推薦Il Masgalano或La Vecchia Latteria"]], detail:"<b>Il Masgalano</b>（Via della Sapienza 47）評價常被稱為西恩納最好吃的冰淇淋，開心果、黑巧克力都很推薦；<b>La Vecchia Latteria</b>（Via S. Pietro 10）也是手工現做、榛果和開心果口味評價很高，兩間都在城區走路可達，選順路的那間即可。"},
   {time:"16:45-17:30", title:"聖多明我大殿 Basilica di San Domenico（聖凱瑟琳聖物＋城景）", nav:"https://www.google.com/maps/dir/?api=1&destination=43.3197333,11.3269417&travelmode=walking", chips:[["gold","⛪ 免費參觀"],["gold","📷 側面可眺望主教座堂全景"]], detail:"這座樸素紅磚教堂供奉著西恩納主保聖人聖女加大利納（St. Catherine of Siena）的頭顱與拇指聖物，氣氛肅穆特別。教堂外側平台是拍攝主教座堂全景的絕佳角度，逆光時分外壯觀，很適合當作今天在城區的最後一站，離Santa Caterina停車場的手扶梯入口也不遠。"},
   {time:"17:30-17:50", title:"走回手扶梯，搭乘下山回停車場取車", nav:"https://www.google.com/maps/dir/?api=1&destination=43.3171988,11.3243961&travelmode=walking", chips:[["sky","🛗 電梯＋手扶梯約10分"]], detail:"原路走回Via di Valle Piatta的手扶梯入口，一路搭手扶梯＋電梯下到停車場樓層取車，結束一整天的城區漫遊。"},
   {time:"17:50-18:00", title:"開車前往 CONAD 超市補貨", nav:"https://www.google.com/maps/dir/?api=1&destination=43.302094,11.323935&travelmode=driving", chips:[["gold","🛒 CONAD Str. Massetana Romana"],["sky","🚗 車程約5分鐘"]], detail:"地址 Str. Massetana Romana 58, 53100 Siena，離Santa Caterina停車場往南約5分鐘車程。這間CONAD評價不錯，貨色齊全，生鮮蔬果、起司熟食、冷凍食品都有，也有賣新鮮pici生麵條，很適合一次補齊接下來幾天在San Fedele自煮的食材，門口就有停車位。"},
   {time:"18:00-18:30", title:"補貨結束，開車前往 San Fedele 正式辦理入住", nav:"https://www.google.com/maps/dir/?api=1&destination=43.3192,11.2734&travelmode=driving", chips:[["sky","🚗 車程約12-15分"],["gold","🏠 入住16:00-21:00內"]], detail:"從CONAD出發往Montalbuccio方向開，車程約12-15分。抵達San Fedele辦理正式入住，現金支付€490（房費474＋城市稅16），記得帶護照登記。之後五晚都住這裡，可以把行李慢慢定位安頓好。"},
   {time:"19:30", title:"晚餐：農莊自煮或附近覓食", chips:[["green","🍳 用超市剛買的食材"],["gold","🍕 附近也有評價很高的Pizzeria Montalbuccio"]], detail:"忙了一整天，晚餐可以直接用超市補貨的食材在San Fedele廚房簡單煮；如果想外食放鬆，附近的<b>Pizzeria Montalbuccio</b>（Str. di Montalbuccio 57，電話 +39 0577 285294）評價很高，主打托斯卡尼菜和窯烤披薩，還能眺望西恩納城景，建議先電話問一下週六是否需要訂位。"}
 ]},

 {n:10, date:'2026-09-20', wd:'日', type:'base', base:'西恩納(托斯卡尼)', accom:'siena',
  stops:[
   {time:"07:30", title:"從民宿出發", nav:null, chips:[["green","🚗 出發"]], detail:"前往Crete Senesi（錫耶納黏土丘陵區）方向。"},
   {time:"08:15", title:"Deserto di Accona 觀景台", nav:"https://www.google.com/maps/dir/?api=1&destination=43.199288,11.589087&travelmode=driving", chips:[["gold","📸 月球表面地貌"]], detail:"座標由老公實地確認。Crete Senesi（錫耶納黏土丘陵）最具代表性的荒涼地貌景觀，波浪起伏的灰色黏土丘陵，寸草不生，宛如月球表面，是托斯卡尼很獨特的一種景觀，跟一般綠意田野完全不同。"},
   {time:"09:00", title:"驅車前往Gladiator觀景公路", nav:null, chips:[["sky","🚗 車程約40分"]], detail:""},
   {time:"09:40", title:"神鬼戰士取景公路 Gladiator Road", nav:"https://www.google.com/maps/dir/?api=1&destination=43.065750,11.6121&travelmode=driving", chips:[["gold","📸 經典絲柏公路"]], detail:"座標由老公實地確認。電影《神鬼戰士》開場夢境場景取景地，一整排絲柏樹夾道的筆直公路，是托斯卡尼最經典、最多人朝聖拍照的畫面之一。"},
   {time:"10:00", title:"小耳朵教堂 Cappella di Vitaleta", nav:"https://www.google.com/maps/dir/?api=1&destination=43.070483,11.64201&travelmode=driving", chips:[["gold","📸 絲柏環繞小教堂"]], detail:"座標由老公實地確認。距離Gladiator公路很近。孤立在山丘上、被絲柏樹環繞的迷你小教堂，是Val d'Orcia最具代表性的畫面之一，跟Cappella di San Vitale名稱容易搞混但是不同地方，注意不要導航錯。"},
   {time:"10:45", title:"驅車前往皮恩扎", nav:null, chips:[["sky","🚗 車程約20分"]], detail:""},
   {time:"11:15", title:"皮恩扎 Pienza 漫遊＋午餐", nav:"https://www.google.com/maps/dir/?api=1&destination=43.078298,11.680387&travelmode=driving", chips:[["gold","🧀 佩科里諾起司之鄉"]], detail:"座標由老公實地確認（停車場）。文藝復興理想城市、教宗庇護二世的故鄉，UNESCO世界遺產小鎮。以佩科里諾羊乳酪聞名，主街上多間起司專賣店可試吃選購。舊城牆邊有俯瞰Val d'Orcia全景的觀景台，適合拍照。"},
   {time:"13:30", title:"驅車前往下午行程（二選一）", nav:null, chips:[["sky","🚗 車程約30-45分"]], detail:"接下來兩個選項擇一，或時間充裕都去：<b>La Foce莊園花園</b>（英義混血作家Iris Origo打造的知名花園莊園，通常需事先預約導覽時段）或<b>Valdichiana Outlet Village</b>（精品Outlet，適合想購物的話）。"},

   {time:"09:00", title:"盧卡城牆騎單車", nav:"https://www.google.com/maps/dir/?api=1&destination=43.846280,10.494896&travelmode=walking", chips:[["gold","🚲 林蔭步道"]], detail:"在城牆邊租單車，繞一圈約4公里，林蔭優美，文藝復興城牆完整保存。"},

   {time:"10:45", title:"盧卡塔 Torre Guinigi 登高拍照", nav:"https://www.google.com/maps/dir/?api=1&destination=Via+Sant%27Andrea+41,+55100+Lucca&travelmode=walking", chips:[["gold","📸 必拍地標"]], detail:"地址 Via Sant'Andrea 41。塔頂種著百年橡樹，是盧卡最經典地標，230階樓梯，登頂可360度俯瞰盧卡城區，遠眺阿普安阿爾卑斯山。<b>拍照機位：</b>塔頂平台四周都能拍，建議繞塔頂一圈找最佳角度；地面仰拍塔頂橡樹剪影也很經典。"},
   {time:"11:45", title:"盧卡在地小吃", nav:"https://www.google.com/maps/dir/?api=1&destination=Via+Buia,+Lucca&travelmode=walking", chips:[["gold","🍕 在地點心"]], detail:"necci栗子粉薄餅包乳酪，或去Via Buia「Da Felice」吃道地手工披薩（扁薄多油、胡椒味重，跟拿坡里披薩完全不同）。"},
   {time:"12:30", title:"午餐＋巷弄漫遊", nav:null, chips:[["green","🍝 正餐＋伴手禮"]], detail:"時間比較充裕，可以坐下來好好吃頓正餐，之後在舊城巷弄逛逛。買buccellato（盧卡招牌甜麵包，找麵包店不要找紀念品店）當伴手禮。"},

/* ================= STORAGE =================
   雲端儲存（Firebase Firestore）：所有裝置打開這個網址，讀寫的都是同一份資料。
   - loadStore()：頁面開啟時，從雲端抓一次目前資料，並訂閱即時更新
     （如果你在手機上新增一筆花費，電腦畫面幾秒內會自動跟著更新，不用重新整理）。
   - doSaveNow()：任何新增/編輯動作，都會即時寫回雲端。
   若網路不通或 Firestore 讀寫失敗，會在畫面上顯示警告，資料先留在記憶體中，
   等網路恢復、下次寫入時會自動再試。
*/
let store = {journal:{}, expenses:{}, pretrip:[], fxRate:34, outdoorMode:false, packing:{}, outfitLog:{}};
let saveTimer=null;
let storageMode = 'cloud';
let suppressNextSnapshot = false; // avoid re-render loop when we just wrote data ourselves

function showStorageWarning(msg){
  const el = document.getElementById('storageWarning');
  if(!el) return;
  if(msg) el.innerHTML = msg;
  el.style.display = 'block';
}
function hideStorageWarning(){
  const el = document.getElementById('storageWarning');
  if(el) el.style.display = 'none';
}

async function loadStore(){
  try{
    const snap = await TRIP_DOC.get();
    if(snap.exists){
      store = Object.assign({journal:{}, expenses:{}, pretrip:[], fxRate:34, outdoorMode:false, packing:{}, outfitLog:{}}, snap.data());
    } else {
      store.pretrip = pretripDefaults.slice();
      await TRIP_DOC.set(store);
    }
    hideStorageWarning();
  }catch(e){
    store.pretrip = pretripDefaults.slice();
    showStorageWarning('⚠️ 目前連不上雲端資料庫，請檢查網路連線後重新整理頁面。新增的內容暫時只留在這個畫面，重新整理可能會遺失。');
  }
  migrateStore();

  // 即時同步：其他裝置寫入資料後，這裡會自動收到更新並重新畫面
  TRIP_DOC.onSnapshot((snap)=>{
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    if(!snap.exists) return;
    store = Object.assign({journal:{}, expenses:{}, pretrip:[], fxRate:34, outdoorMode:false, packing:{}, outfitLog:{}}, snap.data());
    if(typeof mainTab !== 'undefined'){
      if(mainTab==='expense') renderExpenseTab();
      else if(mainTab==='itinerary' && typeof currentView==='number') renderDay(currentView);
      else if(mainTab==='accom') renderAccomTab();
    }
  }, (err)=>{
    showStorageWarning('⚠️ 目前連不上雲端資料庫，請檢查網路連線。');
  });
}
function migrateStore(){
  // one-time cleanup: rename old category labels in already-saved data
  let changed = false;
  const rename = (arr)=>{
    arr.forEach(e=>{ if(e.cat === '住宿訂金'){ e.cat = '住宿'; changed = true; } });
  };
  if(store.pretrip) rename(store.pretrip);
  if(store.expenses) Object.values(store.expenses).forEach(rename);
  if(changed) queueSave(true);
}
function doSaveNow(){
  suppressNextSnapshot = true;
  TRIP_DOC.set(store)
    .then(()=>flashSaved())
    .catch(()=>{ suppressNextSnapshot=false; showStorageWarning('⚠️ 儲存失敗，請檢查網路連線後再試一次。'); });
}
function queueSave(immediate){
  clearTimeout(saveTimer);
  if(immediate){ doSaveNow(); }
  else{ saveTimer = setTimeout(doSaveNow, 600); }
}
function flushSave(){
  // called when the tab is about to be hidden/closed — save NOW, no debounce delay
  clearTimeout(saveTimer);
  doSaveNow();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);
let toastTimer=null;
function flashSaved(){
  const el = document.getElementById('saveToast');
  if(!el) return;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 1600);
}

function openLoginModal(){
  if(isEditor){
    if(confirm('要登出編輯模式嗎？登出後就只能瀏覽，無法新增或修改內容。')){
      auth.signOut();
    }

  }

}
function closeLoginModal(){
  document.getElementById('loginModal').style.display = 'none';
}
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if(!email || !pass) return;
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=>{ closeLoginModal(); })
    .catch((e)=>{
      errEl.textContent = '登入失敗，請確認帳號密碼是否正確。';
      errEl.style.display = 'block';
    });
}
function requireEditor(){
  if(isEditor) return true;
  openLoginModal();
  return false;
}
auth.onAuthStateChanged((user)=>{
  isEditor = !!user;
  const btn = document.getElementById('loginBtn');
  if(btn) btn.textContent = isEditor ? '✅ 編輯模式（點擊登出）' : '🔒 登入編輯';

});

/* ================= 唯讀模式鎖定 =================
   未登入時，把畫面上所有輸入框/打勾格/新增按鈕都鎖住（灰底、不可點擊），
   一眼就能看出目前是唯讀模式。使用 MutationObserver 監看畫面內容，
   只要畫面一有更新（切換分頁、切換日期等）就自動重新套用鎖定，
   不用在每個 render 函式裡個別呼叫。
*/
function applyEditLock(){
  const root = document.getElementById('app');
  if(!root) return;
  root.querySelectorAll('input, textarea, select').forEach(el=>{
    el.disabled = !isEditor;
    el.classList.toggle('locked-field', !isEditor);
  });
  root.querySelectorAll('.btn-add, .btn-del').forEach(el=>{
    el.disabled = !isEditor;
    el.classList.toggle('locked-field', !isEditor);
  });
  root.querySelectorAll('[onclick^="togglePacking"]').forEach(el=>{
    el.classList.toggle('locked-field', !isEditor);
  });
}
const appRoot = document.getElementById('app');
if(appRoot){
  new MutationObserver(()=>applyEditLock()).observe(appRoot, {childList:true, subtree:true});
}

function loadWeatherFor(dayNum, dateStr, acc){
  const el = document.getElementById('weather-block-'+dayNum);
  if(!el) return;
  const body = el.querySelector('.block-body');

  const lat = acc && acc.lat, lng = acc && acc.lng;
  const place = acc && acc.city;
  if(!lat || !lng){
    body.innerHTML = `<div class="empty-hint">這天沒有固定地點座標，暫不提供天氣連結。</div>`;
    return;
  }

  const todayStr = new Date().toISOString().slice(0,10);
  const daysUntil = Math.round((new Date(dateStr) - new Date(todayStr)) / 86400000);

  // 本機檔案（file://）在iOS上無法自動fetch外部資料，改用「開新分頁連結」方式，
  // 因為點連結開分頁不受file://安全限制影響，能穩定運作。
  let label, hint, query;
  if(daysUntil < 0){
    label = `📍 查看${place}當天實際天氣`;
    hint = `這天（${dateStr}）已經過去了，點下方按鈕可以查當天實際發生的氣溫與天氣狀況，當回憶紀錄很不錯。`;
    query = `${place} italy weather on ${dateStr}`;
  } else if(daysUntil <= 15){
    label = `📍 查看${place}即時天氣預報`;
    hint = `目前距這天還有${daysUntil}天，在預報範圍內，點下方按鈕會用瀏覽器開新分頁查即時預報。`;
    query = `weather ${place} italy ${dateStr}`;
  } else {
    label = `📍 查看${place}歷史氣候參考`;
    hint = `目前距這天還有${daysUntil}天，超過一般16天預報範圍，點下方按鈕可查歷史同期氣候當參考；出發前16天內再點就會是即時預報。`;
    query = `${place} italy average temperature weather in september`;
  }
  const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;

  body.innerHTML = `
    <div class="empty-hint" style="margin-bottom:8px;">${hint}</div>
    <div class="btn-row"><a class="btn btn-nav" href="${url}" target="_blank">${label}</a></div>
  `;
}

function statusOf(d){
  if(d.type==='transit' && !d.stops.length) return 'transit';
  const hasContent = d.stops.length || d.attractions.length || d.food.length || d.photo.length;
  return hasContent ? 'plan' : 'todo';
}

  const s = statusOf(d);
  if(s==='transit') return `<span class="badge transit">交通日</span>`;
  if(s==='plan') return `<span class="badge ok">已規劃</span>`;
  return `<span class="badge todo">待規劃</span>`;
}
function fmtDate(iso, wd){

/* ================= RENDER: 花費紀錄 TAB ================= */
let expenseSub = 'total'; // 'total' | 'pretrip' | 'ledger'

function expenseTotalPanel(){
  const dailyAll = Object.values(store.expenses).flat();
  const allEntries = [...store.pretrip, ...dailyAll];
  const totals = {};
  allEntries.forEach(e=>{ totals[e.cur] = (totals[e.cur]||0) + Number(e.amt); });
  const totalsHtml = Object.keys(totals).length
    ? Object.entries(totals).map(([c,v])=>`<div class="stat"><div class="num">${v.toLocaleString()}</div><div class="lbl">${c} 總計</div></div>`).join('')
    : `<div class="empty-hint" style="grid-column:1/-1">尚無花費紀錄</div>`;
  const rate = Number(store.fxRate)||34;
  let twdEquiv = 0;
  Object.entries(totals).forEach(([c,v])=>{
    if(c==='TWD') twdEquiv += v;
    else if(c==='EUR') twdEquiv += v*rate;
    else if(c==='HKD') twdEquiv += v*(rate/8.6*1);
  });
  return `<div class="card">
    <div class="stat-grid">${totalsHtml}</div>
    <div class="form-row" style="margin-top:14px; align-items:center;">
      <div class="empty-hint" style="margin:0">約當台幣參考值（EUR匯率 ×</div>
      <input id="fxRate" type="number" value="${rate}" style="max-width:70px" onchange="updateFx(this.value)">
      <div class="empty-hint" style="margin:0">）</div>
    </div>
    <div class="stat" style="margin-top:4px; text-align:left; padding:12px;">
      <div class="num" style="font-size:22px">≈ NT$ ${Math.round(twdEquiv).toLocaleString()}</div>
      <div class="lbl">行前花費＋17天每日花費 合計參考（僅估算，實際以各幣別分項為準）</div>
    </div>
  </div>`;
}
function expensePretripPanel(){
  const pretripRows = store.pretrip.map((e,idx)=>`
    <div class="exp-item">
      <div><span class="exp-cat">${e.cat}</span>${e.note?(' · '+e.note):''}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="exp-amt">${e.cur} ${Number(e.amt).toLocaleString()}</span>
        <button class="btn-del" onclick="removePretrip(${idx})">✕</button>
      </div>
    </div>`).join('');
  return `<div class="card">
    <div class="empty-hint" style="margin-bottom:8px">已自動帶入住宿與租車費用，機票、保險等請自行新增</div>
    <div class="form-row">
      <select id="pt-cat">
        <option>機票</option><option>住宿</option><option>租車</option><option>保險</option><option>簽證／其他</option>
      </select>
      <input id="pt-amt" type="number" placeholder="金額" inputmode="decimal">
      <select id="pt-cur" style="max-width:80px"><option>EUR</option><option>TWD</option><option>HKD</option></select>
    </div>
    <div class="form-row">
      <input id="pt-note" type="text" placeholder="備註（選填）">
      <button class="btn btn-add" style="flex:0 0 auto" onclick="addPretrip()">新增</button>
    </div>
    <div id="pretrip-list">${pretripRows}</div>
  </div>`;
}
function expenseLedgerPanel(){
  const ledgerDays = days.filter(d => (store.expenses[d.n]||[]).length);
  if(!ledgerDays.length) return `<div class="card"><div class="empty-hint">尚無每日花費紀錄 — 於「每日行程」各天頁面新增即可自動出現在這裡。</div></div>`;
  const rows = ledgerDays.map(d=>{
    const items = store.expenses[d.n].map(e=>`
      <div class="exp-item">
        <div><span class="exp-cat">${e.cat}</span>${e.note?(' · '+e.note):''}</div>
        <span class="exp-amt">${e.cur} ${Number(e.amt).toLocaleString()}</span>
      </div>`).join('');
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:2px" onclick="goDay(${d.n})">
        <b style="font-size:13px">Day ${d.n} · ${fmtDate(d.date,d.wd)}</b>
        <span class="li-meta" style="color:var(--pine)">前往編輯 ›</span>
      </div>
      ${items}
    </div>`;
  }).join('');
  return `<div class="card">${rows}</div>`;
}
function switchExpenseSub(tab){ expenseSub = tab; renderExpenseTab(); }

function renderExpenseTab(){
  const panels = {total:expenseTotalPanel, pretrip:expensePretripPanel, ledger:expenseLedgerPanel};
  const panelHtml = panels[expenseSub]();
  document.getElementById('app').innerHTML = `
    <div class="xtabs">
      <div class="xtab ${expenseSub==='total'?'active':''}" onclick="switchExpenseSub('total')">💶 總結算</div>

}

function tipsPackingPanel(){
  const html = packingList.map(group=>{

      const key = group.cat + '::' + idx;
      const checked = !!store.packing[key];
      return `<div class="list-item" style="display:flex; align-items:center; gap:10px; padding:8px 0; cursor:pointer" onclick="togglePacking('${key.replace(/'/g,"\\'")}')">
        <div style="width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:${checked?'var(--pine)':'var(--card)'};color:#fff;font-size:13px;">${checked?'✓':''}</div>

function renderDay(n){
  const d = days.find(x=>x.n===n);
  const acc = d.accom ? accoms[d.accom] : null;

  let flightsBlock = '';
  if(d.flights && d.flights.length){
    flightsBlock = `<div class="block"><div class="block-head">✈️ 航班</div><div class="block-body">
      ${d.flights.map(f=>`<div class="flight-card"><div><div class="flight-route">${f.route}</div><div class="flight-no">${f.no}</div></div><div class="flight-time">${f.dep} → ${f.arr}</div></div>`).join('')}
      ${d.note?`<div class="note-box">${d.note}</div>`:''}
    </div></div>`;
  }

  let driveBlock = '';
  if(d.drive){
    const toAcc = d.accom ? accoms[d.accom] : null;
    const url = toAcc ? navUrl(toAcc) : null;
    driveBlock = `<div class="block"><div class="block-head">🚗 開車與停車</div><div class="block-body">
      <div class="accom-meta"><b>${d.drive.from}</b> → <b>${d.drive.to}</b></div>
      ${url?`<div class="btn-row"><a class="btn btn-nav" href="${url}" target="_blank">📍 一鍵導航至目的地</a></div>`:''}
      <div class="empty-hint" style="margin-top:8px">${d.driveNote || '本日路段停車建議尚未填入（例如：路上休息站、市區停車場位置與費率）— 之後討論這天時補上。'}</div>
    </div></div>`;
  }

  let accomBlock = '';
  if(acc){
    const url = navUrl(acc);
    accomBlock = `<div class="block"><div class="block-head">🏨 ${d.checkin?'入住':'續住'}：${acc.city}</div><div class="block-body">
      <div class="accom-meta"><b>${acc.name}</b>（${acc.platform}）</div>
      <div class="accom-meta mono">Check-in ${acc.checkin} ／ Check-out ${acc.checkout}</div>
      <div class="accom-meta">${acc.addr}</div>
      ${acc.gps?`<div class="accom-meta mono">${acc.gps}</div>`:''}
      <div class="btn-row">
        ${url?`<a class="btn btn-nav" href="${url}" target="_blank">📍 一鍵導航回住宿</a>`:''}
        <a class="btn btn-call" href="tel:${acc.phone.replace(/\s/g,'')}">📞 撥打電話</a>
      </div>
    </div></div>`;
  }

  function listBlock(title, icon, items, emptyMsg){
    const body = items.length ? items.map(it=>{
      const url = it.lat&&it.lng ? `https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lng}` : (it.addr?`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(it.addr)}`:null);
      return `<div class="list-item">
        <div class="li-name">${it.name}</div>
        <div class="li-meta">${[it.time,it.gps].filter(Boolean).join(' · ')}</div>
        ${it.note?`<div class="li-note">${it.note}</div>`:''}
        ${url?`<div class="btn-row"><a class="btn btn-nav" href="${url}" target="_blank">📍 導航</a></div>`:''}
      </div>`;
    }).join('') : `<div class="empty-hint">${emptyMsg}</div>`;
    return `<div class="block"><div class="block-head">${icon} ${title}</div><div class="block-body">${body}</div></div>`;
  }

  function renderTimeline(day){
    if(!day.stops.length) return '';
    const rows = day.stops.map(s=>{
      const chipsHtml = (s.chips||[]).map(c=>`<span class="chip chip-${c[0]}">${c[1]}</span>`).join('');
      let navBtn = '';
      if(s.nav){
        let viewUrl = null;
        try{
          const u = new URL(s.nav);
          const dest = u.searchParams.get('destination') || u.searchParams.get('query');
          if(dest) viewUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`;
        }catch(e){}
        navBtn = `<div class="tl-nav btn-row">
          <a class="btn btn-nav" href="${s.nav}" target="_blank">📍 導航</a>
          ${viewUrl?`<a class="btn btn-ghost" href="${viewUrl}" target="_blank">🗺️ 檢視地點（不算路線）</a>`:''}
        </div>`;
      }
      return `<div class="tl-stop">
        <div class="tl-time">${s.time}</div>
        <div class="tl-title">${s.title}</div>
        ${chipsHtml?`<div class="tl-chips">${chipsHtml}</div>`:''}
        <div class="tl-detail">${s.detail||''}</div>
        ${navBtn}
      </div>`;
    }).join('');
    return `<div class="block"><div class="block-head">🗓️ 今日時間軸</div><div class="block-body"><div class="timeline">${rows}</div></div></div>`;
  }

  const attractionsBlock = listBlock('景點安排','📍', d.attractions, '尚未規劃 — 我們討論這天時會補上具體景點、建議停留時間與導航點。');
  const foodBlock = listBlock('在地美食（避開觀光餐廳）','🍝', d.food, '尚未規劃 — 之後補上在地小店推薦，不排米其林或純觀光餐廳。');
  const photoBlock = listBlock('拍照口袋名單（含GPS與最佳時段）','📸', d.photo, '尚未規劃 — 之後會依順逆光與人潮，標出最佳機位、GPS座標與拍攝時間。');
  const timelineBlock = renderTimeline(d);

  const dayExpenses = store.expenses[n] || [];
  const expenseRows = dayExpenses.map((e,idx)=>`
    <div class="exp-item">
      <div><span class="exp-cat">${e.cat}</span>${e.note?(' · '+e.note):''}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="exp-amt">${e.cur} ${Number(e.amt).toLocaleString()}</span>
        <button class="btn-del" onclick="removeExpense(${n},${idx})">✕</button>
      </div>
    </div>`).join('');
  const subtotals = {};
  dayExpenses.forEach(e=>{ subtotals[e.cur]=(subtotals[e.cur]||0)+Number(e.amt); });
  const subtotalHtml = Object.entries(subtotals).map(([c,v])=>`<div class="subtotal"><span>今日小計</span><span>${c} ${v.toLocaleString()}</span></div>`).join('');

  const journalVal = store.journal[n] || '';

  document.getElementById('app').innerHTML = `
    <a class="back-link" onclick="goItineraryHome()">← 回每日行程列表</a>
    <div class="day-head">
      <div class="eyebrow">DAY ${String(n).padStart(2,'0')} / 17</div>
      <h1>${fmtDate(d.date,d.wd)}　${d.type==='transit'?d.title:d.base}${badgeHtml(d)}</h1>
      ${d.type!=='transit'?`<div class="meta">今晚住宿：${acc?acc.city:'（移動中）'}</div>`:''}
    </div>

    <div class="block" id="weather-block-${n}">
      <div class="block-head">🌤️ 天氣</div>
      <div class="block-body"><div class="empty-hint">載入中…</div></div>
    </div>

    ${d.stops.length ? '' : flightsBlock}
    ${d.stops.length ? '' : driveBlock}
    ${accomBlock}
    ${d.stops.length ? timelineBlock : (d.type!=='transit'?attractionsBlock+foodBlock+photoBlock:'')}

    <div class="block">
      <div class="block-head">💶 今日花費</div>
      <div class="block-body">
        <div class="form-row">
          <select id="exp-cat-${n}">
            <option>交通／停車</option><option>住宿</option><option>餐飲</option><option>門票</option><option>購物</option><option>其他</option>
          </select>
          <input id="exp-amt-${n}" type="number" placeholder="金額" inputmode="decimal">
          <select id="exp-cur-${n}" style="max-width:80px">
            <option>EUR</option><option>TWD</option><option>HKD</option>
          </select>
        </div>
        <div class="form-row">
          <input id="exp-note-${n}" type="text" placeholder="備註（選填）">
          <button class="btn btn-add" style="flex:0 0 auto" onclick="addExpense(${n})">新增</button>
        </div>
        <div id="exp-list-${n}">${expenseRows}</div>
        ${subtotalHtml}
      </div>
    </div>

    <div class="block">
      <div class="block-head">📝 旅程記事</div>
      <div class="block-body">
        <textarea id="journal-${n}" placeholder="今天發生的事、想記住的瞬間……回國後可另外整理照片附加在這天。" oninput="onJournalInput(${n})">${journalVal}</textarea>
      </div>
    </div>

    <div class="block">
      <div class="block-head">🌡️ 當天實際氣溫紀錄</div>
      <div class="block-body">
        <div class="form-row">
          <input type="text" id="outfit-temp-${n}" placeholder="實際氣溫，例：12°C-18°C" value="${(store.outfitLog[n]&&store.outfitLog[n].temp)||''}" oninput="onOutfitInput(${n})">
        </div>
        <div class="form-row" style="margin-top:6px">
          <input type="text" id="outfit-cond-${n}" placeholder="天氣狀況，例：晴朗微風" value="${(store.outfitLog[n]&&store.outfitLog[n].cond)||''}" oninput="onOutfitInput(${n})">
        </div>
        <div class="empty-hint" id="outfit-hint-${n}" style="margin-top:8px;"></div>
      </div>
    </div>
  `;
  loadWeatherFor(n, d.date, acc);
  loadOutfitDefaults(n, d.date, acc);
}

let outfitTimer=null;
function onOutfitInput(n){
  if(!requireEditor()) return;
  const temp = document.getElementById(`outfit-temp-${n}`).value;
  const cond = document.getElementById(`outfit-cond-${n}`).value;
  store.outfitLog[n] = {temp, cond};
  clearTimeout(outfitTimer);
  outfitTimer = setTimeout(()=>queueSave(true), 500);
}

function loadOutfitDefaults(dayNum, dateStr, acc){
  const hintEl = document.getElementById('outfit-hint-'+dayNum);
  if(!hintEl) return;
  const lat = acc && acc.lat, lng = acc && acc.lng;
  const place = acc && acc.city;
  if(!lat || !lng){ return; }

  const todayStr = new Date().toISOString().slice(0,10);
  const isPast = dateStr < todayStr;
  const alreadyFilled = store.outfitLog[dayNum] && store.outfitLog[dayNum].temp;

  if(alreadyFilled){
    hintEl.innerHTML = '✅ 已記錄';
    return;
  }
  if(!isPast){
    hintEl.innerHTML = '這天還沒發生，之後可以回來手動記錄。';
    return;
  }
  // 本機檔案（file://）在iOS上無法自動fetch外部資料，改用連結讓您自己查完手動填入。
  const query = `${place} italy weather on ${dateStr}`;
  const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
  hintEl.innerHTML = `這天已經過去了，點下方連結可以查當天實際氣溫，查完手動填進上面欄位即可：<div class="btn-row" style="margin-top:6px"><a class="btn btn-ghost" href="${url}" target="_blank">🔍 查${place}當天實際氣溫</a></div>`;
}

/* ================= ACTIONS ================= */
function goAccom(){ mainTab='accom'; currentView='landing'; renderMainTabs(); renderAccomTab(); window.scrollTo(0,0); }
function goItineraryHome(){ mainTab='itinerary'; currentView='landing'; renderMainTabs(); renderRail(); renderItineraryHome(); window.scrollTo(0,0); }
function goExpense(){ mainTab='expense'; currentView='landing'; renderMainTabs(); renderExpenseTab(); window.scrollTo(0,0); }
function goTips(){ mainTab='tips'; currentView='landing'; renderMainTabs(); renderTipsTab(); window.scrollTo(0,0); }
function goFood(){ mainTab='food'; currentView='landing'; renderMainTabs(); renderFoodTab(); window.scrollTo(0,0); }
function goDay(n){ mainTab='itinerary'; currentView=n; renderMainTabs(); renderRail(); renderDay(n); window.scrollTo(0,0); }

function addExpense(n){
  if(!requireEditor()) return;
  const cat = document.getElementById(`exp-cat-${n}`).value;
  const amt = document.getElementById(`exp-amt-${n}`).value;
  const cur = document.getElementById(`exp-cur-${n}`).value;
  const note = document.getElementById(`exp-note-${n}`).value;
  if(!amt || isNaN(amt) || Number(amt)<=0) return;
  store.expenses[n] = store.expenses[n] || [];
  store.expenses[n].push({cat, amt, cur, note});
  queueSave(true);
  renderDay(n);
}
function removeExpense(n, idx){
  if(!requireEditor()) return;
  store.expenses[n].splice(idx,1);
  queueSave(true);
  renderDay(n);
}
function addPretrip(){
  if(!requireEditor()) return;
  const cat = document.getElementById('pt-cat').value;
  const amt = document.getElementById('pt-amt').value;
  const cur = document.getElementById('pt-cur').value;
  const note = document.getElementById('pt-note').value;
  if(!amt || isNaN(amt) || Number(amt)<=0) return;
  store.pretrip.push({cat, amt, cur, note});
  queueSave(true);
  renderExpenseTab();
}
function removePretrip(idx){
  if(!requireEditor()) return;
  store.pretrip.splice(idx,1);
  queueSave(true);
  renderExpenseTab();
}
function updateFx(v){
  if(!requireEditor()){ renderExpenseTab(); return; }
  store.fxRate = Number(v)||34;
  queueSave(true);
  renderExpenseTab();
}
let journalTimer=null;
function onJournalInput(n){
  if(!requireEditor()) return;
  const val = document.getElementById(`journal-${n}`).value;
  store.journal[n] = val;
  clearTimeout(journalTimer);
  journalTimer = setTimeout(()=>queueSave(true), 500);
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(store,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `italy-trip-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
});

function showImportBanner(msg, ok){
  const el = document.getElementById('saveToast');
  if(!el) return;
  el.textContent = msg;
  el.style.background = ok ? 'var(--pine)' : 'var(--red)';
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; el.textContent='已自動儲存 ✓'; el.style.background='var(--pine)'; }, 2600);
}

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(!requireEditor()){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const imported = JSON.parse(ev.target.result);
      store = Object.assign({journal:{}, expenses:{}, pretrip:[], fxRate:34, outdoorMode:false, packing:{}, outfitLog:{}}, imported);
      migrateStore();
      queueSave(true); // try to also push into cloud storage in case it works here
      if(mainTab==='accom') renderAccomTab();
      else if(mainTab==='expense') renderExpenseTab();
      else if(mainTab==='tips') renderTipsTab();
      else if(mainTab==='food') renderFoodTab();
      else if(typeof currentView==='number') renderDay(currentView);
      else renderItineraryHome();
      showImportBanner('✅ 備份資料已匯入成功！', true);
    }catch(err){
      showImportBanner('⚠️ 匯入失敗，檔案格式不正確', false);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // reset so the same file can be re-selected later
});

/* ================= INIT ================= */
(async function init(){
  await loadStore();
  goAccom();
})();
</script>
</body>
</html>
